name: probe
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  j:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "NONEMPTY: $([ -n \"$GITHUB_TOKEN\" ] && echo yes || echo no)"
          echo "LEN: ${#GITHUB_TOKEN}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin 2>&1 | head -n 1
